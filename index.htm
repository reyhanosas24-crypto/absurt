<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keur Maneh Nu Geulis & Ganteng</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #3d3d3d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Nyégah téks kabaos/kaseleksi pas mémbal-mémbal klik */
            user-select: none; 
        }
        .container {
            text-align: center;
            background: #ffffff; 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.15); 
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #9a0000; 
            font-size: 26px;
            margin-bottom: 10px;
            /* Méré animasi ratug jantung dina judul */
            animation: ratug 1.2s infinite;
        }
        @keyframes ratug {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        p {
            color: #4a4a4a; 
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        #btn-mau {
            background-color: #ff7096;
            color: white;
        }
        #btn-mau:hover {
            background-color: #ff477e;
            transform: scale(1.1);
        }
        #btn-gamau {
            background-color: #e0e0e0;
            color: #666666;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1 id="headline">Hai Kamu... ❤️</h1>
        <p id="subline">Adakah 10jt untuk ku?</p>
        
        <div class="btn-group">
            <button id="btn-mau" onclick="terimaCinta()">ADA</button>
            <button id="btn-gamau" onmouseover="kabur()" onclick="kabur()">Ewh ah</button>
        </div>
    </div>

    <script>
        function kabur() {
            const btn = document.getElementById('btn-gamau');
            
            // Aturan luncat dinamis dumasar ukuran layar aslina
            const lebarLayar = window.innerWidth - btn.clientWidth - 40;
            const tinggiLayar = window.innerHeight - btn.clientHeight - 40;
            
            // Langsung luncat acak sa-layar bari aman ti batan kaluar tina visual
            const x = Math.random() * (lebarLayar / 3) - (lebarLayar / 6);
            const y = Math.random() * (tinggiLayar / 3) - (tinggiLayar / 6);
            
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function terimaCinta() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <h1 style="font-size: 36px; color: #ff1493;">❤️ HAHA Prank-Prank❤️</h1>
                <p style="margin-top: 20px; font-weight: bold; color: #ff4d6d;">
                    Ciee... Ditunggu duid nyo <br> Makasih nya geus milih 'Mau' (da emang moal bisa nolak oge sih wkwk).
                </p>
            `;
            document.body.style.backgroundColor = "#ffb3c1";
        }
    </script>
</body>
</html>
