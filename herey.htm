<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keur Maneh Nu Geulis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 1. Ngaganti warna background luar jadi pink lemes */
            background-color: #ffe5ec; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            /* 2. Ngaganti kotak tengah jadi bodas méh beresih sarta tulisanana katempo */
            background: #ffffff; 
            padding: 40px;
            border-radius: 20px;
            /* Méré kalangkang lemes di tukangeun kotak */
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.15); 
            max-width: 400px;
            width: 90%;
        }
        h1 {
            /* 3. Ngaganti warna tulisan judul jadi pink poék (Aesthetic) */
            color: #ff477e; 
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            /* 4. Ngaganti warna tulisan sub-judul jadi kulawu rada poék méh ngeunah dibaca */
            color: #4a4a4a; 
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        /* 5. Warna Tombol MAU (Pink Keren) */
        #btn-mau {
            background-color: #ff7096;
            color: white;
        }
        #btn-mau:hover {
            background-color: #ff477e;
            transform: scale(1.1);
        }
        /* 6. Warna Tombol GA MAU (Kulawu Kalem) */
        #btn-gamau {
            background-color: #e0e0e0;
            color: #666666;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1 id="headline">Hai Kamu... ❤️</h1>
        <p id="subline">Mau ga jadi pacar aku?</p>
        
        <div class="btn-group">
            <button id="btn-mau" onclick="terimaCinta()">Mau</button>
            <button id="btn-gamau" onmouseover="kabur()" onclick="kabur()">Ga Mau</button>
        </div>
    </div>

    <script>
        // Logika jang nyieun tombol "Ga Mau" kabur-kaburan
        function kabur() {
            const btn = document.getElementById('btn-gamau');
            const rangeLuncat = 120; 
            
            const x = (Math.random() - 0.5) * rangeLuncat * 2;
            const y = (Math.random() - 0.5) * rangeLuncat * 2;
            
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Logika pas ngetok tombol "Mau"
        function terimaCinta() {
            const card = document.getElementById('main-card');
            
            // Ngarobah eusi card jadi pesen I Love Bandung nu ku maneh hayang
            card.innerHTML = `
                <h1 style="font-size: 40px; color: #ff1493;">❤️ i love ahmad ❤️</h1>
                <p style="margin-top: 20px; font-weight: bold; color: #ff4d6d;">
                    Ciee... formalitasna ditarima! <br> Makasih nya geus milih 'Mau' (da emang moal bisa nolak oge sih wkwk).
                </p>
            `;
            
            // Éfék tambahan ngarobah background body jadi leuwih caang pas ditarima
            document.body.style.backgroundColor = "#ffb3c1";
        }
    </script>
</body>
</html>
